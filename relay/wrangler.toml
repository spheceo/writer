# Writer's relay: the only place the ElevenLabs key lives. The desktop app
# sends audio here; the key never ships in the binary.
# Deploy with `bunx wrangler deploy` from relay/.
name = "writer-relay"
main = "src/index.ts"
compatibility_date = "2026-10-13"
workers_dev = true
preview_urls = false

[vars]
# Where people sign in: the access tokens' issuer, and the home of its JWKS.
ACCOUNTS_URL = "https://accounts.spheceo.com"

# "1": Repack's writer:commitScript takes `actor` (Repack 4ee1d39), so a script's first
# commit records who started it, from their verified sign-in.
STAMP_CREATOR = "1"

# Daily audio per person and across everyone,
# in bytes of 32 kbps Opus (~14.4 MB per hour). Footage is heard as Edit hears it: in 40 s pieces for
# its words and whole for its voices, so an hour of footage is ~2.2 hours of
# audio here. A long interview is a few hours.
DAILY_BYTES_PER_IP = "288000000"  # per person: ~20 hours of audio, ~9 hours of footage
DAILY_BYTES_TOTAL = "288000000"   # ~20 hours, Edit's cap too (~16.6k credits a day at most)
MAX_UPLOAD_BYTES = "45000000"     # ~3 hours in one request

# Bursts: requests a minute per IP. Writer hears four 48 s pieces at once, as
# Edit does, and can run imports side by side: Edit's relay takes 60 a
# minute. The daily byte caps above still bound the spend. Namespace is not
# Edit's (7701).
[[ratelimits]]
name = "BURST"
namespace_id = "7702"

[ratelimits.simple]
limit = 60
period = 60

# The watcher: Gemini windows a minute per IP. An import watches a few
# minutes of footage at a time, four at once.
[[ratelimits]]
name = "WATCH_BURST"
namespace_id = "7703"

[ratelimits.simple]
limit = 40
period = 60

# Atomic daily reservations, including requests still in flight.
[[durable_objects.bindings]]
name = "BUDGET"
class_name = "TranscriptionBudget"

[[migrations]]
tag = "v1-budget"
new_sqlite_classes = ["TranscriptionBudget"]

# Who made each request (person id and email's first part, never a token) is
# logged per request; Workers Logs keeps them (free plan: 200k lines a day).
[observability]
enabled = true
