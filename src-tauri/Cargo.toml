[package]
name = "writer"
version = "0.0.0"
description = "Local script editor"
edition = "2021"
rust-version = "1.90"
publish = false

# The Dock and the menu bar show the binary's own name while `just dev` runs it
# outside an app bundle, so it carries the capital the bundle has.
[[bin]]
name = "Writer"
path = "src/main.rs"

[lib]
name = "writer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
uuid = { version = "1", features = ["v4"] }
# Writer talks HTTP itself, so nobody needs curl or anything else installed.
ureq = { version = "2", features = ["json"] }
sha2 = "0.10"
# Local time for the log (localtime_r); already in the lockfile through Tauri.
libc = "0.2"
# Signing in (account.rs): the refresh token in the Keychain, PKCE's random
# verifier and its base64url.
security-framework = "3"
getrandom = "0.3"
base64 = "0.22"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
