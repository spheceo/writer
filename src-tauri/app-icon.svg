<!-- The favicon's artwork on Apple's 1024 icon grid: an 824 tile, 100 in from each edge. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141414"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)" filter="url(#shadow)"/>
  <rect x="102" y="102" width="820" height="820" rx="183" fill="none" stroke="#2a2a2a" stroke-width="4"/>
  <g transform="translate(100 100) scale(12.875)">
    <rect x="13" y="14" width="38" height="7.5" rx="3.75" fill="#ededed"/>
    <rect x="13" y="28.25" width="29" height="7.5" rx="3.75" fill="#ededed"/>
    <rect x="13" y="42.5" width="15" height="7.5" rx="3.75" fill="#ededed"/>
    <rect x="33" y="40.25" width="12" height="12" rx="3" fill="#ff0033"/>
  </g>
</svg>
